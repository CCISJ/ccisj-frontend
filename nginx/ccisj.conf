# Servidor del frontend en producción (lo usa `Dockerfile.prod`): sirve los
# archivos que genera `vite build`, con las cabeceras de seguridad que en
# desarrollo no hay. `__ORIGEN_API__` lo reemplaza el build con el origen de
# VITE_API_URL.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Sin la versión de nginx en las respuestas ni en las páginas de error.
    server_tokens off;

    # --- Cabeceras de seguridad ------------------------------------------------
    # `always` las manda también en los errores (404, 500). Van en el bloque
    # `server` y ningún `location` agrega cabeceras propias: en nginx, un
    # `add_header` dentro de un `location` borra todas las heredadas.
    #
    # CSP: la app no tiene scripts ni estilos en línea, ni carga nada de otros
    # sitios (verificado sobre el build), así que todo es 'self'. La única
    # excepción es la API. Los comprobantes y CV se abren en una pestaña nueva
    # navegando al enlace firmado, y eso la CSP no lo restringe.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self' __ORIGEN_API__; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # HTTPS obligatorio por un año. El navegador la ignora si la página llegó
    # por HTTP, así que no molesta antes de tener el certificado.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Aislamiento entre sitios: ninguna otra página puede tener una referencia
    # a esta ventana (COOP), ni cargar sus archivos (CORP), y esta solo carga
    # recursos que lo permiten explícitamente (COEP). La app no embebe nada
    # de otros sitios; los comprobantes se abren en una pestaña aparte. Las
    # dos últimas las pidió el escaneo de ZAP sobre la preproducción.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # --- Archivos ---------------------------------------------------------------
    # Los de `assets/` llevan un hash en el nombre: si cambian, cambia el
    # nombre. Se pueden guardar para siempre.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    # Todo lo demás es una ruta de la app (Vue Router en modo historial): si no
    # es un archivo, va el `index.html`. Ese nunca se guarda en caché, para
    # que un despliegue nuevo se vea enseguida.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
