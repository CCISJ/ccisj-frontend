# SonarCloud: analisis estatico de seguridad (SAST) del frontend.
#
# Es gratis porque el repositorio es publico. Complementa a oxlint, que corre
# local en segundos y mira un archivo a la vez: Sonar sigue el recorrido de un
# dato desde donde entra hasta donde se pinta en pantalla, y con eso detecta
# los caminos por donde podria colarse HTML sin escapar (XSS), que es el riesgo
# propio de esta mitad del sistema.
#
# Si al crear el proyecto SonarCloud muestra una clave distinta a la de abajo,
# hay que corregir esta linea: el analisis falla si no coincide.
sonar.organization=ccisj
sonar.projectKey=CCISJ_ccisj-frontend
sonar.projectName=ccisj-frontend

sonar.sources=src
sonar.exclusions=dist/**,coverage/**

# Todavia no hay tests de frontend, asi que no hay cobertura que informar. Al
# agregarlos, descomentar la linea de abajo y generar el reporte con Vitest.
# sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
