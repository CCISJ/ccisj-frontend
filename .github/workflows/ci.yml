# Integración continua: en cada PR y en cada push a main, GitHub levanta una
# máquina limpia y corre los mismos chequeos que cada uno corre en su máquina.
# Si alguno falla, el PR aparece en rojo antes de mergearlo.
#
# El job se sigue llamando "Lint y build" aunque ahora también corre los
# tests: ese nombre es el que la protección de main exige en verde, y
# cambiarlo dejaría a main esperando un chequeo que ya no existe.
#
# SonarCloud analiza el código pero no lo compila: un error de tipos o un
# build roto le pasan de largo. Esto los atrapa.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Solo lee el código: no puede escribir en el repo ni comentar en los PR.
permissions:
  contents: read

# Si se sube otro commit al mismo PR, se cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint y build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Cada acción va fijada al commit exacto y no a una etiqueta como `@v5`:
    # una etiqueta la puede mover su dueño (o quien le robe la cuenta) y la
    # próxima corrida ejecutaría otro código con acceso a este repo. El
    # comentario dice qué versión es ese commit.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node y pnpm (arriba) en las mismas versiones que el Dockerfile.
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Formato
        run: pnpm format:check

      - name: Build (incluye el chequeo de tipos)
        run: pnpm build

      - name: Tests (con cobertura)
        run: pnpm test:coverage

      # SonarCloud no puede mostrar la cobertura: su "Automatic Analysis" no
      # ejecuta tests y recibirla desde acá exige un token. Así queda a la
      # vista en cada corrida, en el resumen del job, sin ningún secreto.
      - name: Resumen de cobertura
        run: |
          node -e "
          const t = require('./coverage/coverage-summary.json').total;
          const fila = (nombre, k) => '| ' + nombre + ' | ' + t[k].pct + ' % | ' + t[k].covered + ' de ' + t[k].total + ' |';
          console.log([
            '## Cobertura de los tests', '',
            '| | % | Cubiertas |', '|---|---|---|',
            fila('Sentencias', 'statements'), fila('Ramas', 'branches'),
            fila('Funciones', 'functions'), fila('Líneas', 'lines'),
          ].join('\n'));
          " >> "$GITHUB_STEP_SUMMARY"
