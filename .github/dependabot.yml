# Dependabot: un bot de GitHub que revisa las dependencias y abre un PR cuando
# hay una versión nueva. Cada PR pasa por el CI (lint, formato y build), así
# que llega ya probado: si está en verde, se puede mergear.
#
# Los PR salen los lunes, agrupados para no llenar el repo de PR sueltos:
# - uno con todas las actualizaciones menores y parches;
# - uno por cada actualización mayor, que puede romper cosas y se mira aparte.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Montevideo
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      menores-y-parches:
        update-types: [minor, patch]
    # TypeScript 7 rompe el build: vue-tsc 3.3 carga `typescript/lib/tsc`, que
    # la 7 ya no exporta (el compilador nuevo está escrito en Go). Sacar esta
    # regla cuando vue-tsc soporte la 7. Las versiones nuevas de la 6 sí llegan.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  # Las acciones del CI van fijadas por SHA (ver ci.yml). Dependabot actualiza
  # el SHA y el comentario con la versión.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Montevideo
    commit-message:
      prefix: 'chore(ci)'
    groups:
      acciones:
        patterns: ['*']
